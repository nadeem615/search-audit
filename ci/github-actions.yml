name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.19.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install both agent layouts in an isolated project
        run: node scripts/install.mjs --agent both --scope project --project-dir .ci-smoke --skip-deps
      - name: Check installed CLI entrypoints
        run: |
          node .ci-smoke/.agents/skills/search-audit/scripts/audit.mjs --help
          node .ci-smoke/.claude/skills/search-audit/scripts/audit.mjs --help